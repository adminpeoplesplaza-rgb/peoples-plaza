<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | People's Plaza</title>
<link rel="icon" type="image/png" href="/peoples-plaza-logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
<main class="w-full max-w-md rounded-3xl border border-fuchsia-900/80 bg-slate-900 p-6 sm:p-7 shadow-2xl space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
    <a href="login.html" class="text-pink-300 hover:underline font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i><span data-i18n="reset.shop_login">Shop Login</span></a>
    <div class="flex items-center gap-2">
      <div class="pp-lang-switcher" role="group" aria-label="Language selector">
        <button type="button" onclick="window.ppSetLanguage('en')" data-lang-switch="en" class="pp-lang-btn active">EN</button>
        <button type="button" onclick="window.ppSetLanguage('ne')" data-lang-switch="ne" class="pp-lang-btn">नेपाली</button>
      </div>
      <a href="admin-login.html" class="text-slate-400 hover:text-white" data-i18n="forgot.admin_login">Admin Login →</a>
    </div>
  </div>

  <div class="text-center">
    <img id="reset-logo" src="/peoples-plaza-logo.png" alt="People's Plaza Logo" class="mx-auto mb-2.5 h-14 w-auto object-contain" onerror="this.onerror=null;this.src=window.PP_LOGO_DATA_URL||'peoples-plaza-logo.png'">
    <span class="px-2.5 py-0.5 rounded-full bg-emerald-600/20 text-emerald-300 text-[10px] font-extrabold uppercase tracking-widest" data-i18n="reset.badge">Token Verified</span>
    <h1 class="text-xl font-extrabold text-white mt-1.5" data-i18n="reset.title">Set New Password</h1>
    <p id="reset-account-info" class="text-xs text-slate-400 mt-1" data-i18n="reset.desc">Create a new password for your verified People's Plaza account.</p>
  </div>

  <form id="reset-form" class="space-y-3.5">
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="reset.email_label">Account Email *</span>
      <input id="reset-email" type="email" required readonly class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950/70 p-3 text-slate-300 text-xs focus:outline-none">
    </label>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="reset.unit_label">Shop Unit / Role *</span>
        <input id="reset-unit" type="text" required readonly class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950/70 p-3 text-slate-300 text-xs focus:outline-none">
      </label>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="reset.phone_label">Phone Number *</span>
        <input id="reset-phone" type="tel" required readonly class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950/70 p-3 text-slate-300 text-xs focus:outline-none">
      </label>
    </div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="reset.new_pass_label">New Password (Min 6 characters) *</span>
      <input id="reset-new-password" type="password" required minlength="6" placeholder="Enter new password" data-i18n-placeholder="reset.new_pass_placeholder" class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 p-3 text-white text-xs focus:border-pink-500 focus:outline-none">
    </label>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="reset.confirm_pass_label">Confirm New Password *</span>
      <input id="reset-confirm-password" type="password" required minlength="6" placeholder="Confirm new password" data-i18n-placeholder="reset.confirm_pass_placeholder" class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 p-3 text-white text-xs focus:border-pink-500 focus:outline-none">
    </label>

    <button type="submit" id="reset-submit-btn" class="w-full rounded-xl bg-pink-600 p-3.5 font-bold text-xs uppercase tracking-wider hover:bg-pink-500 transition shadow-lg shadow-pink-600/25" data-i18n="reset.btn_submit">
      Update Password in Database
    </button>
    <div id="reset-msg" role="status" aria-live="polite" class="text-center text-xs font-semibold"></div>
  </form>
</main>

<script>
let verifiedEmail = "";
let verifiedUnit = "";
let verifiedPhone = "";

window.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(window.location.search);
  let storedRec = null;
  try {
    storedRec = JSON.parse(sessionStorage.getItem("pp_verified_recovery") || localStorage.getItem("pp_verified_recovery_last") || "null");
  } catch (e) {}

  verifiedEmail = (params.get("email") || (storedRec && storedRec.email) || "").trim().toLowerCase();
  verifiedUnit = (params.get("unit") || (storedRec && storedRec.unit) || "PP-101").trim().toUpperCase();
  verifiedPhone = (params.get("phone") || (storedRec && storedRec.phone) || "").trim();

  const emailInput = document.getElementById("reset-email");
  const unitInput = document.getElementById("reset-unit");
  const phoneInput = document.getElementById("reset-phone");

  if (verifiedEmail) {
    emailInput.value = verifiedEmail;
  } else {
    emailInput.removeAttribute("readonly");
    emailInput.placeholder = "Enter your registered email";
  }
  if (verifiedUnit) {
    unitInput.value = verifiedUnit;
  } else {
    unitInput.removeAttribute("readonly");
    unitInput.placeholder = "Enter shop unit (e.g. PP-101 or ADMIN)";
  }
  if (verifiedPhone) {
    phoneInput.value = verifiedPhone;
  } else {
    phoneInput.removeAttribute("readonly");
    phoneInput.placeholder = "Enter registered phone number";
  }

  if (window.ppPullSupabaseSystemSync) {
    await window.ppPullSupabaseSystemSync();
  }
  const cms = window.ppGetCMS ? window.ppGetCMS() : null;
  if (cms && cms.logoUrl) {
    document.getElementById("reset-logo").src = cms.logoUrl;
  }

  const db = window.ppSupabase;
  if (db) {
    try {
      const { data } = await db.auth.getSession();
      if (data && data.session && data.session.user && data.session.user.email) {
        if (!verifiedEmail) {
          verifiedEmail = data.session.user.email.toLowerCase();
          emailInput.value = verifiedEmail;
        }
      }
      db.auth.onAuthStateChange((event, session) => {
        if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && session && session.user && session.user.email) {
          verifiedEmail = session.user.email.toLowerCase();
          emailInput.value = verifiedEmail;
        }
      });
    } catch (e) {}
  }
});

document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("reset-email").value.trim().toLowerCase();
  const unit = document.getElementById("reset-unit").value.trim().toUpperCase();
  const phone = document.getElementById("reset-phone").value.trim();
  const newPass = document.getElementById("reset-new-password").value;
  const confirmPass = document.getElementById("reset-confirm-password").value;
  const btn = document.getElementById("reset-submit-btn");
  const msg = document.getElementById("reset-msg");

  if (newPass !== confirmPass) {
    msg.className = "rounded-xl bg-red-950/90 border border-red-800 p-3 text-center text-xs font-semibold text-red-200";
    msg.textContent = "Passwords do not match. Please re-enter.";
    return;
  }
  if (newPass.length < 6) {
    msg.className = "rounded-xl bg-red-950/90 border border-red-800 p-3 text-center text-xs font-semibold text-red-200";
    msg.textContent = "Password must be at least 6 characters.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Updating Password in Supabase...";
  msg.textContent = "";

  try {
    const res = await window.ppUpdatePasswordInDatabase(email, unit, newPass, phone);
    if (!res.ok) {
      msg.className = "rounded-xl bg-red-950/90 border border-red-800 p-3 text-center text-xs font-semibold text-red-200";
      msg.textContent = res.message || "Could not update password.";
      btn.disabled = false;
      btn.textContent = "Update Password in Database";
      return;
    }

    const isAdmin = email === "adminpeoplesplaza@gmail.com" || unit === "ADMIN";
    const targetLogin = isAdmin ? "admin-login.html" : "login.html";

    msg.className = "rounded-xl bg-emerald-950/90 border border-emerald-800 p-3 text-center text-xs font-semibold text-emerald-200 space-y-2";
    msg.innerHTML = `
      <div><i class="fa-solid fa-circle-check mr-1"></i>${res.message}</div>
      <div class="pt-1"><a href="${targetLogin}" class="inline-block rounded-lg bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-white font-bold text-[11px] transition">Continue to Login →</a></div>
    `;

    setTimeout(() => {
      window.location.href = targetLogin;
    }, 1000);
  } catch (err) {
    msg.className = "rounded-xl bg-red-950/90 border border-red-800 p-3 text-center text-xs font-semibold text-red-200";
    msg.textContent = "Update error: " + (err.message || "Please try again.");
    btn.disabled = false;
    btn.textContent = "Update Password in Database";
  }
});
</script>
</body>
</html>
