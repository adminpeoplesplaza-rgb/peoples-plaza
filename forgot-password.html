<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password | Security Verification - People's Plaza</title>
<link rel="icon" type="image/png" href="/peoples-plaza-logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
<main class="w-full max-w-md rounded-3xl border border-fuchsia-900/80 bg-slate-900 p-6 sm:p-7 shadow-2xl space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
    <a href="login.html" class="text-pink-300 hover:underline font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i><span data-i18n="forgot.back_login">Back to Shop Login</span></a>
    <div class="flex items-center gap-2">
      <div class="pp-lang-switcher" role="group" aria-label="Language selector">
        <button type="button" onclick="window.ppSetLanguage('en')" data-lang-switch="en" class="pp-lang-btn active">EN</button>
        <button type="button" onclick="window.ppSetLanguage('ne')" data-lang-switch="ne" class="pp-lang-btn">नेपाली</button>
      </div>
      <a href="admin-login.html" class="text-slate-400 hover:text-white" data-i18n="forgot.admin_login">Admin Login →</a>
    </div>
  </div>

  <div class="text-center">
    <img id="forgot-logo" src="/peoples-plaza-logo.png" alt="People's Plaza Logo" class="mx-auto mb-2.5 h-14 w-auto object-contain" onerror="this.onerror=null;this.src=window.PP_LOGO_DATA_URL||'peoples-plaza-logo.png'">
    <span class="px-2.5 py-0.5 rounded-full bg-pink-600/20 text-pink-300 text-[10px] font-extrabold uppercase tracking-widest" data-i18n="forgot.badge">Security Verification</span>
    <h1 class="text-xl font-extrabold text-white mt-1.5" data-i18n="forgot.title">Forgot Password Recovery</h1>
    <p class="text-xs text-slate-400 mt-1" data-i18n="forgot.desc">Enter your registered email, shop number, and phone number to verify your account in the database and proceed to reset your password.</p>
  </div>

  <form id="forgot-form" class="space-y-3.5">
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="forgot.email_label">Registered Email Address *</span>
      <input id="recovery-email" type="email" required placeholder="e.g. zara@peoplesplaza.com.np" data-i18n-placeholder="forgot.email_placeholder" class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 p-3 text-white text-xs focus:border-pink-500 focus:outline-none">
    </label>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="forgot.unit_label">Shop Number / Unit *</span>
      <input id="recovery-unit" type="text" required placeholder="e.g. PP-101 (or ADMIN for Admin)" data-i18n-placeholder="forgot.unit_placeholder" class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 p-3 text-white text-xs focus:border-pink-500 focus:outline-none">
    </label>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300"><span data-i18n="forgot.phone_label">Registered Phone Number *</span>
      <input id="recovery-phone" type="tel" required placeholder="e.g. +977 01-4245101 or 9800000000" data-i18n-placeholder="forgot.phone_placeholder" class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 p-3 text-white text-xs focus:border-pink-500 focus:outline-none">
    </label>

    <button type="submit" id="send-recovery-btn" class="w-full rounded-xl bg-pink-600 p-3.5 font-bold text-xs uppercase tracking-wider hover:bg-pink-500 transition shadow-lg shadow-pink-600/25" data-i18n="forgot.btn_reset">
      Reset
    </button>
    <div id="recovery-msg" role="status" aria-live="polite" class="text-center text-xs font-semibold"></div>
  </form>
</main>

<script>
window.addEventListener("DOMContentLoaded", async () => {
  if (window.ppPullSupabaseSystemSync) {
    await window.ppPullSupabaseSystemSync();
  }
  const cms = window.ppGetCMS ? window.ppGetCMS() : null;
  if (cms && cms.logoUrl) {
    document.getElementById("forgot-logo").src = cms.logoUrl;
  }
  const params = new URLSearchParams(window.location.search);
  if (params.get("role") === "admin") {
    document.getElementById("recovery-email").value = "adminpeoplesplaza@gmail.com";
    document.getElementById("recovery-unit").value = "ADMIN";
    document.getElementById("recovery-phone").value = "+977 01-4245000";
  }
});

document.getElementById("forgot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("recovery-email").value.trim().toLowerCase();
  const unit = document.getElementById("recovery-unit").value.trim().toUpperCase();
  const phone = document.getElementById("recovery-phone").value.trim();
  const btn = document.getElementById("send-recovery-btn");
  const msg = document.getElementById("recovery-msg");

  btn.disabled = true;
  btn.textContent = "Verifying Database...";
  msg.textContent = "";

  try {
    const verification = await window.ppVerifyShopRecovery(email, unit, phone);
    if (!verification.valid) {
      msg.className = "rounded-xl bg-red-950/90 border border-red-800 p-3 text-center text-xs font-semibold text-red-200";
      msg.textContent = verification.message;
      btn.disabled = false;
      btn.textContent = "Reset";
      return;
    }

    const recoveryUrl = "reset-password.html?email=" + encodeURIComponent(verification.email) + "&unit=" + encodeURIComponent(verification.unit) + "&phone=" + encodeURIComponent(verification.phone || phone) + "&token=" + encodeURIComponent(verification.token);
    const emailRedirectUrl = window.location.protocol.startsWith("http")
      ? new URL(recoveryUrl, window.location.href).href
      : recoveryUrl;

    const db = window.ppSupabase;
    if (db && window.location.protocol.startsWith("http")) {
      try {
        await Promise.race([
          db.auth.resetPasswordForEmail(verification.email, { redirectTo: emailRedirectUrl }),
          new Promise((resolve) => setTimeout(resolve, 1500))
        ]);
      } catch (err) {}
    }

    const web3Payload = {
      access_key: "e34a655a-94cd-4d5d-a988-51f3c946e238",
      subject: "Password Reset Verification - People's Plaza (" + verification.shopName + ")",
      from_name: "People's Plaza Admin (adminpeoplesplaza@gmail.com)",
      replyto: "adminpeoplesplaza@gmail.com",
      recipient_email: verification.email,
      shop_number: verification.unit,
      phone_number: verification.phone || phone,
      shop_name: verification.shopName,
      recovery_link: emailRedirectUrl,
      message: "Security verification passed for " + verification.shopName + " (Shop No: " + verification.unit + ", Phone: " + (verification.phone || phone) + "). Reset password link: " + emailRedirectUrl
    };
    try {
      if (window.location.protocol.startsWith("http")) {
        await fetch("/api/web3forms", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(web3Payload)
        });
      } else {
        const fd = new FormData();
        Object.entries(web3Payload).forEach(([k, v]) => fd.append(k, String(v)));
        await fetch("https://api.web3forms.com/submit", { method: "POST", body: fd, mode: "no-cors" });
      }
    } catch (err) {}

    msg.className = "rounded-xl bg-emerald-950/90 border border-emerald-800 p-3 text-center text-xs font-semibold text-emerald-200 space-y-2";
    msg.innerHTML = `
      <div><i class="fa-solid fa-circle-check mr-1"></i>Database verification passed for <strong>${verification.email}</strong> (${verification.unit} · ${verification.phone || phone}).</div>
      <div class="pt-1"><a href="${recoveryUrl}" id="proceed-reset-link" class="inline-block rounded-lg bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-white font-bold text-[11px] transition">Proceed to Reset Password Page →</a></div>
    `;

    setTimeout(() => {
      window.location.href = recoveryUrl;
    }, 500);
  } catch (err) {
    msg.className = "rounded-xl bg-red-950/90 border border-red-800 p-3 text-center text-xs font-semibold text-red-200";
    msg.textContent = "Verification error: " + (err.message || "Please try again.");
    btn.disabled = false;
    btn.textContent = "Reset";
  }
});
</script>
</body>
</html>
